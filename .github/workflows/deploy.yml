name: Build en deploy naar Strato

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      
      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Dependencies installeren
        run: npm ci
      
      - name: Site builden
        run: npm run build
      
      - name: Uploaden naar Strato via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/home/www'
